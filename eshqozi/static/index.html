<!doctype html>
<html lang="uz">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eshqo‘zi — sinov</title>
<style>
:root{font-family:system-ui,sans-serif;color:#163c33;background:#f0f5ef}body{margin:0;padding:28px 16px}main{max-width:760px;margin:auto}header{display:flex;align-items:center;gap:16px}h1{margin:0;font-size:38px}small{color:#537268}.logo{width:60px;height:60px;background:#14624a;color:white;border-radius:20px;display:grid;place-items:center;font-size:32px}.notice{background:#fff8dd;border:1px solid #e7d899;padding:14px;border-radius:12px;margin:24px 0}.controls{display:flex;gap:12px;flex-wrap:wrap}select,input,button{font:inherit;padding:12px;border:1px solid #b2c8ba;border-radius:10px}select{background:white;max-width:100%}button{background:#14624a;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#messages{min-height:280px;max-height:440px;overflow:auto;padding:20px 0;display:flex;flex-direction:column;gap:14px}.bubble{white-space:pre-wrap;line-height:1.55;padding:14px 18px;background:white;border-radius:16px;max-width:85%;box-shadow:0 2px 8px #183c3308}.mine{background:#d9eddd;align-self:flex-end}form{display:flex;gap:10px}input{flex:1;min-width:0;background:white}.actions{display:flex;gap:10px;margin-top:16px}.actions button{background:transparent;color:#14624a}#status{min-height:24px;margin-top:10px;color:#8d423a}label{display:grid;gap:6px;font-size:14px}@media(max-width:480px){h1{font-size:30px}.controls{display:grid;grid-template-columns:1fr 1fr}.bubble{max-width:90%}form button{padding:10px}}</style></head>
<body><main><header><div class="logo" aria-hidden="true">E</div><div><h1>Eshqo‘zi</h1><small>O‘zbekcha suhbat, o‘zimizning ohangda.</small></div></header>
<div class="notice"><strong>Sinov muhiti</strong> — AI xizmati ulanmagan. Bu yerda sheva tanlash, so‘z ma’nosi va suhbat boshqaruvini tekshirishingiz mumkin.</div>
<div class="controls"><label>Sheva<select id="dialect" aria-label="Sheva"></select></label><label>Ohang<select id="tone"><option value="samimiy">Samimiy</option><option value="dostona">Do‘stona</option><option value="dagal">Dag‘alroq</option></select></label></div>
<section id="messages" role="log" aria-live="polite"><div class="bubble">Shevani tanlang va bir so‘z haqida so‘rang. Masalan: Xorazmda “pitta nima?”</div></section>
<form id="form"><input id="text" maxlength="4000" autocomplete="off" placeholder="Savolingizni yozing…" aria-label="Xabar" required><button id="send">Yuborish</button></form><div id="status" role="status"></div>
<div class="actions"><button type="button" id="clear">Tarixni o‘chirish</button><button type="button" id="forget">Hammasini o‘chirish</button></div>
</main><script>
const $=id=>document.getElementById(id);let busy=false;
function bubble(text,mine=false){const n=document.createElement('div');n.className='bubble'+(mine?' mine':'');n.textContent=text;$('messages').append(n);$('messages').scrollTop=$('messages').scrollHeight;}
async function send(text){if(busy)return;busy=true;$('send').disabled=true;$('status').textContent='';bubble(text,true);try{const r=await fetch('/api/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,dialect:$('dialect').value,tone:$('tone').value})});if(!r.ok)throw new Error('Xabarni yuborib bo‘lmadi. Qayta urinib ko‘ring.');const data=await r.json();for(const m of data.messages)bubble(m.text);}catch(e){$('status').textContent=e.message;}finally{busy=false;$('send').disabled=false;$('text').focus();}}
$('form').addEventListener('submit',e=>{e.preventDefault();const text=$('text').value.trim();if(text&&!busy){$('text').value='';send(text);}});
$('clear').onclick=()=>send('/clear');$('forget').onclick=()=>send('/forget');
fetch('/api/dialects').then(r=>r.json()).then(rows=>{for(const row of rows){const option=document.createElement('option');option.value=row.id;option.textContent=row.label;$('dialect').append(option);}}).catch(()=>{$('status').textContent='Shevalar ro‘yxatini yuklab bo‘lmadi.';});
</script></body></html>
